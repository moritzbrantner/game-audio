[package]
name = "game-audio"
description = "Shared game audio director: cue manifest, buses, voice stealing, cooldowns, cue-key dedup, distance fade and stereo pan, with kira (native) and Web Audio (wasm32) backends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
## Native backend (kira on cpal). Ignored on wasm32.
kira = ["dep:kira"]
## Browser backend (Web Audio API through web-sys). Only compiled on wasm32.
web = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kira = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioContext",
  "AudioContextState",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioScheduledSourceNode",
  "BaseAudioContext",
  "GainNode",
  "Response",
  "StereoPannerNode",
  "Window",
] }

[[example]]
name = "tones"
required-features = ["kira"]
