[workspace]
members = ["crates/game-audio", "crates/game-audio-wasm"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moritzbrantner/game-audio"
rust-version = "1.88"

[workspace.dependencies]
game-audio = { path = "crates/game-audio", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kira = { version = "0.12", default-features = false, features = ["cpal", "wav", "ogg"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
web-sys = "0.3"

# Only affects builds of this workspace (the wasm package); consumers use their own profiles.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
