name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --features game-audio/kira -- -D warnings
      - run: cargo test --locked --workspace --all-targets --features game-audio/kira
      - run: cargo build --locked -p game-audio --example tones --features kira

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install wasm-bindgen CLI matching Cargo.lock
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p game-audio --features web -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p game-audio-wasm -- -D warnings
      - run: scripts/build-web.sh
      - run: bun test
        working-directory: web
      - name: Prepare distribution commit (dry run)
        if: github.event_name == 'pull_request'
        run: scripts/publish-git-dist.sh

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install wasm-bindgen CLI matching Cargo.lock
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: scripts/build-web.sh
      - run: scripts/publish-git-dist.sh --push
      - name: Summarize distribution commit
        run: |
          {
            echo '```json'
            cat target/npm/git-dist.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  merge-ready:
    name: merge-ready
    if: always()
    needs: [rust, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["rust", "wasm"]'
